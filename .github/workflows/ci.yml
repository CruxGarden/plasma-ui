name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify # tsc + node:test + esbuild — the same gate the agent runs
      - run: npm run build:pages # the site and every example still build
      # Peer range is react >=18 but devDependencies pin the 18 types, so the
      # 19 shapes (RefObject<T | null>, the new ref-as-prop) are only ever
      # exercised here. Last, because it swaps what is in node_modules.
      - run: npm run typecheck:react19
